name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned dependencies from the hash locks
        run: |
          python -m pip install --require-hashes -r requirements.lock
          # requirements-dev.lock pins pip and setuptools in its --allow-unsafe block for the
          # lock-regeneration environment only. Installing them here would replace the runner's
          # own pip and setuptools before the editable install, so drop those two stanzas and
          # install every other pin and hash exactly as the lock declares them.
          awk '/^(pip|setuptools)==/ { skip = 1; next } skip && /^[[:space:]]/ { next } { skip = 0; print }' \
            requirements-dev.lock > "$RUNNER_TEMP/requirements-dev.ci.lock"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements-dev.ci.lock"

      - name: Install the project (editable, no build isolation, no dependency resolution)
        run: python -m pip install --no-build-isolation --no-deps -e .

      - name: "Syntax gate: python -m compileall -q qrcheck tests"
        run: python -m compileall -q qrcheck tests

      - name: Unit gate (85 % coverage floor)
        run: |
          mkdir -p reports
          pytest -m "not e2e" --strict-markers --junitxml=reports/pytest-unit.xml --cov=qrcheck --cov-fail-under=85

      - name: Per-package coverage floor 90 % (config, registry, report)
        run: |
          # Each package is floored on its own, so one below 90 % cannot be carried
          # over the floor by the other two.
          coverage report --include='qrcheck/config/*' --fail-under=90
          coverage report --include='qrcheck/registry/*' --fail-under=90
          coverage report --include='qrcheck/report/*' --fail-under=90

      - name: "Line-ceiling gate: qrcheck loc (ceiling from qrcheck.toml loc_limit)"
        run: qrcheck loc

  e2e:
    name: End-to-end proof
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned dependencies from the hash locks
        run: |
          python -m pip install --require-hashes -r requirements.lock
          # requirements-dev.lock pins pip and setuptools in its --allow-unsafe block for the
          # lock-regeneration environment only. Installing them here would replace the runner's
          # own pip and setuptools before the editable install, so drop those two stanzas and
          # install every other pin and hash exactly as the lock declares them.
          awk '/^(pip|setuptools)==/ { skip = 1; next } skip && /^[[:space:]]/ { next } { skip = 0; print }' \
            requirements-dev.lock > "$RUNNER_TEMP/requirements-dev.ci.lock"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements-dev.ci.lock"

      - name: Install the project (editable, no build isolation, no dependency resolution)
        run: python -m pip install --no-build-isolation --no-deps -e .

      - name: Install the SVG rasterizer (rsvg-convert)
        run: sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Corpus drift check (regenerate, then compare)
        run: |
          mkdir -p reports
          qrcheck corpus build --seed 20240101 --out "$RUNNER_TEMP/corpus-regenerated.jsonl"
          diff -u corpus/default.jsonl "$RUNNER_TEMP/corpus-regenerated.jsonl"

      # The report roots are produced under the basetemp deliberately, outside the worktree,
      # because the tier asserts that nothing is written into the repository's reports/; only
      # this junit xml lands there. The evidence upload below therefore reads the basetemp.
      - name: "End-to-end proof (marker: e2e)"
        run: pytest -m e2e --strict-markers --basetemp="$RUNNER_TEMP/pytest-e2e" --junitxml=reports/pytest-e2e.xml

      - name: Upload the pytest run reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qrcheck-reports
          path: reports/
          if-no-files-found: error

      - name: Upload the end-to-end evidence tree
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qrcheck-e2e-evidence
          path: ${{ runner.temp }}/pytest-e2e/
          if-no-files-found: error
